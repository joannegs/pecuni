spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.pecuni: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness and /readiness for the AWS deploy (work plan, week 8)

pecuni:
  jwt:
    secret: ${JWT_SECRET} # injected via AWS Secrets Manager, never committed
