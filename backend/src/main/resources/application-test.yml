# Datasource URL/credentials are NOT set here — they're injected at runtime via
# @DynamicPropertySource pointing at the Testcontainers Postgres instance
# (see the base integration test class, added in week 3 of the work plan).
# This keeps a single source of truth for the container's connection info.

spring:
  jpa:
    show-sql: false

logging:
  level:
    com.pecuni: INFO

pecuni:
  jwt:
    secret: test-secret-fixed-value-for-deterministic-tests
  google:
    # never resolved against real Google servers in tests — GoogleTokenVerifier
    # is mocked at the controller-integration level, and unit-tested in isolation
    client-id: test-client-id
