server:
  port: 8081 # 8080 conflicts with a local Apache (httpd) already running on this machine

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pecuni
    username: pecuni
    password: pecuni
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.pecuni: DEBUG
    org.hibernate.SQL: DEBUG

pecuni:
  jwt:
    # local-only secret — never reused in test/prod, see application-prod.yml
    secret: local-dev-secret-do-not-use-in-production-please-change-me
  google:
    # Must match the frontend's dev googleClientId (src/environments/environment.ts) —
    # GoogleIdTokenVerifier rejects any ID token whose audience doesn't match this.
    client-id: 84775773852-8gng5suamrvb60sa5le63bu24n0h9rgc.apps.googleusercontent.com
