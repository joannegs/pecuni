spring:
  application:
    name: pecuni-backend
  jpa:
    open-in-view: false # avoid lazy-loading surprises leaking into the web layer
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Custom app properties (bound via @ConfigurationProperties later)
pecuni:
  jwt:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
