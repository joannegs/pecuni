name: frontend-ci

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # No spec files exist yet at the skeleton stage (week 1) and ESLint
      # hasn't been wired in (see repo root README) — this step is added
      # back in once there's real component code to lint/test against,
      # rather than shipping a green checkmark that isn't actually checking
      # anything.
      - name: Build (production)
        run: npm run build
