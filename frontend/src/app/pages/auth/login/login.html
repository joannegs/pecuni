<app-auth-container>
  <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="login__field">
      <label class="login__label" for="email">E-mail</label>
      <div class="login__input-wrap">
        <svg class="login__input-icon" lucideMail [size]="16"></svg>
        <input class="login__input" id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
    </div>

    <div class="login__field">
      <label class="login__label" for="password">Password</label>
      <div class="login__input-wrap">
        <svg class="login__input-icon" lucideLock [size]="16"></svg>
        <input class="login__input" id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
    </div>

    <div class="login__row">
      <label class="login__checkbox">
        <input class="login__checkbox-input" type="checkbox" formControlName="rememberMe" />
        <span class="login__checkbox-label">Remember me</span>
      </label>
      <button type="button" class="login__link">Forgot my password</button>
    </div>

    <button type="submit" class="login__button login__button--primary">Login</button>

    <div class="login__divider"><span class="login__divider-text">or continue with</span></div>

    <div class="login__social-row">
      <button type="button" class="login__button login__button--social">
        <img class="login__social-icon" src="assets/images/google-logo.png" alt="" />
        Google
      </button>
      <button type="button" class="login__button login__button--social">
        <img class="login__social-icon" src="assets/images/apple-logo.png" alt="" />
        Apple
      </button>
    </div>

    <p class="login__signup">
      Doesn't have an account yet? <a class="login__link" routerLink="/signup">Sign-up</a>
    </p>
  </form>
</app-auth-container>
